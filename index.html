<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Erro 404 — Página pausada | Pata Vet</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="./fachada.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#060809;color:#F7F3EA;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:#C8FF3D;filter:blur(180px);opacity:.1;top:-160px;left:-160px}
body::after{content:"";position:absolute;width:460px;height:460px;border-radius:50%;background:#FFC94A;filter:blur(180px);opacity:.1;bottom:-160px;right:-160px}
.wrap{position:relative;z-index:1;max-width:640px}
.photo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 26px;display:block;border:2px solid rgba(200,255,61,.5);box-shadow:0 0 40px rgba(200,255,61,.25)}
.code{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(100px,20vw,190px);line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:3px #C8FF3D}
h1{font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(32px,6vw,56px);line-height:1.05;letter-spacing:-.03em;margin:10px 0 14px}
h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#FFC94A}
p{color:rgba(247,243,234,.6);font-size:16px;line-height:1.6;max-width:44ch;margin:0 auto}
.label{font-family:'Sora',sans-serif;font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#C8FF3D;margin-top:26px}
</style>
</head>
<body>
<main class="wrap">
<img class="photo" src="./fachada.webp" alt="Pata Vet" />
<p class="code">404</p>
<h1>A página foi <em>pausada.</em></h1>
<p>Entre em contato com o desenvolvedor.</p>
<p class="label">Pata Vet · Clínica Veterinária e Pet Shop</p>
</main>
</body>
</html>
